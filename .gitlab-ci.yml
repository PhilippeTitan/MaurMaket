# MaurMaket — GitLab QA gate → clean GitHub mirror
# Flow: every push lands HERE first, tests run, and main mirrors to
# GitHub ONLY when the full test stage is green. Never hand-push GitHub again.

include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Dependency-Scanning.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

stages:
  - test
  - deploy
  - deps

default:
  image: node:24
  interruptible: true

.npm_cache: &npm_cache
  key:
    files:
      - package-lock.json
  paths:
    - .npm

test:
  stage: test
  variables:
    NODE_OPTIONS: "--max-old-space-size=4096"
  cache:
    <<: *npm_cache
  script:
    - npm ci --cache .npm --no-audit --no-fund
    - echo "── TypeScript compile check ──"
    - npx tsc --noEmit
    - echo "── Guardrails (16 checks) ──"
    - npm test

unit:
  stage: test
  variables:
    NODE_OPTIONS: "--max-old-space-size=4096"
  cache:
    <<: *npm_cache
  script:
    - npm ci --cache .npm --no-audit --no-fund
    - echo "── Unit tests (vitest) ──"
    - npx vitest run

smoke:
  stage: test
  services:
    - name: postgres:16-alpine
      alias: postgres
  variables:
    POSTGRES_USER: "ci"
    POSTGRES_PASSWORD: "ci"
    POSTGRES_DB: "maurmaket_ci"
    DATABASE_URL: "postgres://ci:ci@postgres:5432/maurmaket_ci?sslmode=disable"
    NODE_ENV: "test"
    JWT_SECRET: "ci-smoke-secret-not-for-prod"
    PORT: "3999"
  cache:
    <<: *npm_cache
  script:
    - npm ci --cache .npm --no-audit --no-fund
    - |
      echo "Waiting for postgres..."
      for i in $(seq 1 45); do
        node -e "const n=require('net');const s=n.connect(5432,'postgres',()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1))" && break
        sleep 2
      done
    - echo "── Server smoke (boot + migrations + listen) ──"
    - node scripts/server-smoke.mjs

audit:
  stage: test
  # Report-only: all highs are Expo/Metro build-toolchain deps (braces, node-forge,
  # uuid) with no non-breaking fix — requires an Expo SDK upgrade. Re-tighten then.
  allow_failure: true
  cache:
    <<: *npm_cache
  script:
    - npm ci --cache .npm --no-audit --no-fund
    - echo "── npm audit (report-only) ──"
    - npm audit --audit-level=high

ui:
  stage: test
  variables:
    NODE_OPTIONS: "--max-old-space-size=6144"
    EXPO_NO_TELEMETRY: "1"
    CI: "true"
  cache:
    <<: *npm_cache
  script:
    - npm ci --cache .npm --no-audit --no-fund
    - echo "── Expo web export ──"
    - npx expo export --platform web --output-dir dist-web
    - echo "── Playwright UI smoke ──"
    - npx playwright install chromium --with-deps
    - npx playwright test
  artifacts:
    when: always
    paths:
      - playwright-report/
      - test-results/
    expire_in: 1 week

mirror:
  stage: deploy
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  variables:
    GIT_DEPTH: "0"
  script:
    - |
      if [ -z "${GITHUB_SYNC_TOKEN}" ]; then
        echo "ERROR: GITHUB_SYNC_TOKEN CI variable is not set."
        echo ""
        echo "Setup (one-time, ~2 minutes):"
        echo "  1. github.com → Settings → Developer settings → Fine-grained tokens"
        echo "     Repository access: Only select repositories → PhilippeTitan/MaurMaket"
        echo "     Permissions → Repository permissions → Contents: Read and write"
        echo "  2. gitlab.com → PhilippeTitan/MaurMaket → Settings → CI/CD → Variables"
        echo "     Add variable GITHUB_SYNC_TOKEN (Masked ✓, Protected ✓)"
        echo "  3. Re-run this job (or push again to main)"
        exit 1
      fi
    - git remote add github "https://oauth2:${GITHUB_SYNC_TOKEN}@github.com/PhilippeTitan/MaurMaket.git"
    - git fetch github main
    - git push --force-with-lease="refs/heads/main:$(git rev-parse FETCH_HEAD)" github HEAD:main
    - echo "GitHub mirror synced ← $(git rev-parse --short HEAD) $(git log -1 --pretty=%s)"

# Dependency update MRs (Dependabot-equivalent, free tier).
# Run manually from CI/CD → Jobs → renovate → Run (or add a schedule).
# Requires CI/CD variable RENOVATE_TOKEN — see AGENTS.md "Renovate".
renovate:
  stage: deps
  allow_failure: true
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
  image: renovate/renovate:latest
  variables:
    RENOVATE_PLATFORM: "gitlab"
    RENOVATE_REPOSITORIES: "PhilippeTitan/MaurMaket"
    RENOVATE_ONBOARDING: "false"
    RENOVATE_LOG_LEVEL: "INFO"
  script:
    - |
      if [ -z "${RENOVATE_TOKEN}" ]; then
        echo "RENOVATE_TOKEN CI/CD variable is not set — see AGENTS.md 'Renovate' for the one-time setup."
        exit 0
      fi
    - renovate
